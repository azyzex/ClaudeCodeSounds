name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-unix:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # The runner ships with neither sounds nor any audio player, so without
      # this the notifier would find nothing to play and fall straight through
      # to the terminal bell, leaving the interesting path untested. A null sink
      # gives paplay somewhere real to write to.
      - name: Install sounds, players and a null audio sink (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            sound-theme-freedesktop libnotify-bin \
            pulseaudio pulseaudio-utils alsa-utils ffmpeg
          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=ci >/dev/null 2>&1 || true
          pactl info 2>/dev/null | head -3 || echo "no pulse server, expect the bell fallback"

      - name: Integration tests
        run: bash tests/test-unix.sh

      # The runners have no audio device, so nothing is audible. What this does
      # prove is that the notifier finds a sound file that really exists on a
      # real system, walks its player chain when those players fail, and still
      # exits clean. That is the path that cannot be tested from Windows.
      - name: Notifier against real system sounds
        run: |
          export HOME="$(mktemp -d)"
          NO_TEST_TONE=1 bash install-claude-sound-alerts.sh >/dev/null

          echo "players present:"
          for p in afplay paplay pw-play canberra-gtk-play ffplay aplay; do
            if command -v "$p" >/dev/null 2>&1; then echo "  $p"; fi
          done

          echo "sound files visible to the notifier:"
          ls /usr/share/sounds/freedesktop/stereo/*.oga 2>/dev/null | head -4 || true
          ls /System/Library/Sounds/*.aiff 2>/dev/null | head -4 || true

          fail=0
          chosen=""
          for kind in done blocked limit error; do
            rm -f "${TMPDIR:-/tmp}"/claude-notify.*.last
            out=$(mktemp); errf=$(mktemp)
            # The if-form keeps `set -e` from aborting before the code is read.
            if echo '{"message":"ci payload","session_id":"ci","cwd":"/tmp/p"}' \
               | CLAUDE_NOTIFY_DEBUG=1 bash "$HOME/.claude/claude-notify.sh" "$kind" \
                 >"$out" 2>"$errf"; then rc=0; else rc=$?; fi
            report=$(cat "$out"); err=$(cat "$errf"); rm -f "$out" "$errf"

            if [ "$rc" != "0" ]; then
              echo "  FAIL $kind exited $rc"; fail=1; continue
            fi
            if [ -n "$err" ]; then
              echo "  FAIL $kind wrote to stderr: $err"; fail=1; continue
            fi
            echo "  ok   $kind -> $report"

            # A zero exit says nothing about whether audio was reached, so assert
            # on the reported decision. macOS always has afplay, so falling back
            # to the bell there is a genuine regression.
            case "$report" in
              *"sound=none"*)
                echo "       FAIL no sound file was found at all"; fail=1 ;;
            esac

            # Collect the resolved file so distinctness can be checked below.
            # Pipe-delimited rather than newline-delimited, because a bare
            # newline here would end the YAML block scalar.
            picked=${report#*sound=}; picked=${picked%% *}
            chosen="$chosen$picked|"
            if [ "$(uname -s)" = "Darwin" ]; then
              case "$report" in
                *player=afplay*) ;;
                *) echo "       FAIL expected afplay on macOS, got: $report"; fail=1 ;;
              esac
            fi
          done

          # Four events are only useful if they sound different. This caught
          # limit and error resolving to the same file on both macOS and
          # Windows, which quietly defeated the entire point of giving
          # rate_limit its own StopFailure matcher.
          total=$(printf '%s' "$chosen" | tr '|' '\n' | grep -c . || true)
          distinct=$(printf '%s' "$chosen" | tr '|' '\n' | sort -u | grep -c . || true)
          echo "resolved $total sounds, $distinct distinct"
          if [ "$total" = "4" ] && [ "$distinct" != "4" ]; then
            echo "FAIL two alert kinds resolve to the same sound file:"
            printf '%s' "$chosen" | tr '|' '\n' | sort | uniq -d | sed 's/^/  /'
            fail=1
          fi

          # On Linux a working sink is not guaranteed, so report rather than fail.
          if [ "$(uname -s)" = "Linux" ]; then
            rm -f "${TMPDIR:-/tmp}"/claude-notify.*.last
            r=$(echo '{}' | CLAUDE_NOTIFY_DEBUG=1 bash "$HOME/.claude/claude-notify.sh" done 2>/dev/null)
            case "$r" in
              *player=bell*) echo "note: no usable audio player on this runner, bell fallback exercised" ;;
              *)             echo "note: a real player handled it -> $r" ;;
            esac
          fi
          exit "$fail"

  test-windows:
    name: test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integration tests
        shell: powershell
        run: .\tests\test-windows.ps1

  generated:
    name: installers match their source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The installers are generated from templates/ plus notifier/. Editing a
      # notifier without regenerating would ship a stale installer, so this
      # fails the build rather than letting the two drift apart.
      - name: Check the committed installers are up to date
        run: python3 build/generate.py --check

  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Tauri needs the system webview and its build dependencies on Linux.
      # Windows and macOS already have theirs.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/src-tauri/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Icons are reproducible from build/make-icons.py
        if: runner.os == 'Linux'
        run: |
          python3 build/make-icons.py >/dev/null
          git diff --exit-code -- app/src-tauri/icons \
            || { echo "icons differ from what make-icons.py produces; commit the regenerated files"; exit 1; }

      - name: Formatting
        working-directory: app/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The config and hooks modules are where the real logic lives, and they
      # have to agree with the installer scripts about the file formats.
      - name: Tests
        working-directory: app/src-tauri
        run: cargo test

  lint-web:
    name: web and bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The extension has no build step and no dependencies on purpose, so this
      # is a syntax and shape check rather than a bundler run.
      - name: Extension syntax and manifest
        run: |
          for f in extension/*.js; do node --check "$f"; done
          python3 - <<'PY'
          import json, sys
          m = json.load(open('extension/manifest.json'))
          assert m['manifest_version'] == 3, 'must be MV3'
          # The permissions are the security story, so they are asserted rather
          # than left to review. A broad host permission must never creep in.
          assert m['host_permissions'] == ['https://claude.ai/*'], m['host_permissions']
          for banned in ('tabs', 'history', 'cookies', 'downloads', '<all_urls>'):
              assert banned not in m.get('permissions', []), banned
              assert banned not in m.get('host_permissions', []), banned
          assert 'nativeMessaging' in m.get('optional_permissions', []),               'the bridge permission must stay optional'
          assert 'nativeMessaging' not in m.get('permissions', []),               'the bridge permission must not be required'
          print('manifest ok:', m['host_permissions'], m['permissions'])
          PY

      - name: Bridge tests
        run: python3 tests/test-bridge.py

  lint-shell:
    name: lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The notifier is a real file now, so it can be linted directly rather
      # than having to install it first to get it out of a heredoc.
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -S warning \
            install-claude-sound-alerts.sh \
            notifier/claude-notify.sh \
            tests/test-unix.sh

  lint-powershell:
    name: lint (PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Import-Module PSScriptAnalyzer
          $settings = '.github/PSScriptAnalyzerSettings.psd1'
          $found = @()
          # The notifier is a real file now, so it is analysed directly rather
          # than having to run the installer first to get it out of a here-string.
          foreach ($f in @('install-claude-sound-alerts.ps1',
                           'notifier\claude-notify.ps1',
                           'tests\test-windows.ps1')) {
            $found += Invoke-ScriptAnalyzer -Path $f -Settings $settings
          }

          if ($found) {
            $found | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
            exit 1
          }
          Write-Host "clean"
