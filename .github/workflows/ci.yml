name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-unix:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the freedesktop sound theme (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sound-theme-freedesktop libnotify-bin

      - name: Integration tests
        run: bash tests/test-unix.sh

      # The runners have no audio device, so nothing is audible. What this does
      # prove is that the notifier finds a sound file that really exists on a
      # real system, walks its player chain when those players fail, and still
      # exits clean. That is the path that cannot be tested from Windows.
      - name: Notifier against real system sounds
        run: |
          export HOME="$(mktemp -d)"
          NO_TEST_TONE=1 bash install-claude-sound-alerts.sh >/dev/null

          echo "players present:"
          for p in afplay paplay pw-play canberra-gtk-play ffplay aplay; do
            if command -v "$p" >/dev/null 2>&1; then echo "  $p"; fi
          done

          echo "sound files visible to the notifier:"
          ls /usr/share/sounds/freedesktop/stereo/*.oga 2>/dev/null | head -4 || true
          ls /System/Library/Sounds/*.aiff 2>/dev/null | head -4 || true

          fail=0
          for kind in done blocked limit error; do
            rm -f "${TMPDIR:-/tmp}"/claude-notify.*.last
            # The if-form keeps `set -e` from aborting before the code is read.
            if err=$(echo '{"message":"ci payload","session_id":"ci","cwd":"/tmp/p"}' \
                     | bash "$HOME/.claude/claude-notify.sh" "$kind" 2>&1 >/dev/null); then
              rc=0
            else
              rc=$?
            fi
            if [ "$rc" != "0" ]; then
              echo "  FAIL $kind exited $rc"; fail=1
            elif [ -n "$err" ]; then
              echo "  FAIL $kind wrote to stderr: $err"; fail=1
            else
              echo "  ok   $kind"
            fi
          done
          exit "$fail"

  test-windows:
    name: test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integration tests
        shell: powershell
        run: .\tests\test-windows.ps1

  lint-shell:
    name: lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck the installer and test suite
        run: |
          shellcheck --version
          shellcheck -S warning install-claude-sound-alerts.sh tests/test-unix.sh

      # The notifier body lives inside a quoted heredoc, so shellcheck treats it
      # as inert text and never analyses it. Install first, then lint the file
      # the installer actually wrote.
      - name: shellcheck the generated notifier
        run: |
          export HOME="$(mktemp -d)"
          NO_TEST_TONE=1 bash install-claude-sound-alerts.sh >/dev/null
          shellcheck -S warning "$HOME/.claude/claude-notify.sh"

  lint-powershell:
    name: lint (PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Import-Module PSScriptAnalyzer
          $settings = '.github/PSScriptAnalyzerSettings.psd1'
          $found = @()
          foreach ($f in @('install-claude-sound-alerts.ps1', 'tests\test-windows.ps1')) {
            $found += Invoke-ScriptAnalyzer -Path $f -Settings $settings
          }

          # Same blind spot as shellcheck: the notifier is generated by the
          # installer, so analyse the file it actually emits.
          $sandbox = Join-Path $env:TEMP ([guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $sandbox -Force | Out-Null
          $env:USERPROFILE = $sandbox
          $env:NO_TEST_TONE = '1'
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\install-claude-sound-alerts.ps1 *> $null
          $emitted = Join-Path $sandbox '.claude\claude-notify.ps1'
          if (-not (Test-Path $emitted)) { Write-Host "notifier was not generated"; exit 1 }
          $found += Invoke-ScriptAnalyzer -Path $emitted -Settings $settings

          if ($found) {
            $found | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
            exit 1
          }
          Write-Host "clean"
